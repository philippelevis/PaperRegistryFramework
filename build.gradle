plugins {
    id 'java'
}

group = 'net.Vivelle'
version = '0.2'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.build.doLast {
    // Define the source and destination directories
    def buildDir = "C:/Users/Vivelle__/MCreatorWorkspaces/paper-registry-framework/build/libs"
    project.logger.log(LogLevel.ERROR, buildDir)
    def targetDir1 = file("D:/New Folder (2)/plugins") // Change to your first target directory
    def targetDir2 = file("$buildDir/../../../dev-dank-horse/libs") // Change to your second target directory

    // Copy the built artifacts to the target directories
    copy {
        from buildDir
        into targetDir1
        include '*.jar' // Adjust this to match your output files
    }
    copy {
        from buildDir
        into targetDir2
        include '*.jar' // Adjust this to match your output files
    }
}
